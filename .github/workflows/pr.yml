name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@feat/keep-composer-json
    with:
      tools-ref: feat/keep-composer-json
      slug: palasthotel-integration-for-prolitteris
      dev-plugin-name: Palasthotel Integration for ProLitteris - DEV
      # Requires PHP: 8.2
      php-versions: '["8.2", "8.3", "8.4"]'
      # public/dist and public/vendor are not in the repository; the pipeline builds them
      build-command: npm ci && npm run build
      # what the plugin loads, so a renamed build output fails here instead of
      # 404ing in the editor
      required-files: |
        vendor/autoload.php
        vendor/html2text/html2text/src/Html2Text.php
        dist/gutenberg.js
        dist/gutenberg.asset.php
        cli/wp-cli.php
        composer.json
        composer.lock
